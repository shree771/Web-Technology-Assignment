<!DOCTYPE html>
<html lang="en">

<head>

    <!-- ================= PAGE INFORMATION ================= -->

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Grade Calculator</title>

    <!-- Connect External CSS -->
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- ================= MAIN CONTAINER ================= -->

    <div class="container">

        <!-- Page Heading -->
        <h1>Student Grade Calculator</h1>

        <p class="subtitle">
            Enter student details and marks
        </p>


        <!-- ================= STUDENT NAME ================= -->

        <div class="input-group">

            <label for="studentName">
                Student Name
            </label>

            <input
                type="text"
                id="studentName"
                placeholder="Enter student name">

        </div>


        <!-- ================= SUBJECT 1 ================= -->

        <div class="input-group">

            <label for="m1">
                Subject 1
            </label>

            <input
                type="number"
                id="m1"
                min="0"
                max="100"
                placeholder="Enter marks">

        </div>


        <!-- ================= SUBJECT 2 ================= -->

        <div class="input-group">

            <label for="m2">
                Subject 2
            </label>

            <input
                type="number"
                id="m2"
                min="0"
                max="100"
                placeholder="Enter marks">

        </div>


        <!-- ================= SUBJECT 3 ================= -->

        <div class="input-group">

            <label for="m3">
                Subject 3
            </label>

            <input
                type="number"
                id="m3"
                min="0"
                max="100"
                placeholder="Enter marks">

        </div>


        <!-- ================= SUBJECT 4 ================= -->

        <div class="input-group">

            <label for="m4">
                Subject 4
            </label>

            <input
                type="number"
                id="m4"
                min="0"
                max="100"
                placeholder="Enter marks">

        </div>


        <!-- ================= SUBJECT 5 ================= -->

        <div class="input-group">

            <label for="m5">
                Subject 5
            </label>

            <input
                type="number"
                id="m5"
                min="0"
                max="100"
                placeholder="Enter marks">

        </div>


        <!-- ================= BUTTONS ================= -->

        <div class="buttons">

            <!-- Calculate Button -->
            <button
                class="calculate-btn"
                onclick="calculate()">

                Calculate

            </button>


            <!-- Reset Button -->
            <button
                class="reset-btn"
                onclick="resetForm()">

                Reset

            </button>

        </div>


        <!-- ================= RESULT SECTION ================= -->

        <div id="result">

            <p>
                Enter details and click
                <strong>Calculate</strong>.
            </p>

        </div>

    </div>


    <!-- Connect External JavaScript -->
    <script src="script.js"></script>

</body>

</html>
